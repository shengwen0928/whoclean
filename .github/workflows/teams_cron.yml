name: Weekly WhoClean Reminder

on:
  schedule:
    # 台灣時間每週一早上 02:00 (格林威治標準時間 UTC 每週日傍晚 18:00)
    - cron: '0 18 * * 0'
  workflow_dispatch: # 允許手動在 GitHub 頁面上點擊執行測試

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scheduler
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: node cron_scheduler.js

      - name: Commit and push current_duty.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add current_duty.json
          git diff-index --quiet HEAD || (git commit -m "chore: 自動更新值日生資料 current_duty.json" && git push)
